name: Investimentos – APK Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes do motor de análise
        run: ./gradlew :core:test

      - name: Compilar APK
        run: ./gradlew :app:assembleDebug :app:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: conselheiro-investimentos-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk

      # Link fixo para descarregar no telemóvel:
      # https://github.com/<dono>/<repo>/releases/download/investimentos-latest/conselheiro-investimentos.apk
      - name: Publicar APK na release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk conselheiro-investimentos.apk
          gh release delete investimentos-latest --yes --cleanup-tag || true
          gh release create investimentos-latest conselheiro-investimentos.apk \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "Conselheiro de Investimentos (última versão)" \
            --notes "APK Android compilado a partir de ${{ github.sha }}. Descarregue conselheiro-investimentos.apk e instale no telemóvel."
