<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Capa Desfocada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Sala de cinema: ecrã escuro, cartaz iluminado no centro, bilhetes como botões. */
:root{
  color-scheme:dark;
  --bg:#0c0b10;        /* sala às escuras */
  --panel:#16141c;     /* superfícies */
  --line:#2a2733;      /* filetes */
  --ink:#f1ede4;       /* texto */
  --muted:#9a94a6;     /* texto secundário */
  --gold:#f2c14e;      /* luz do projetor */
  --ok:#3ecf8e;        /* certo */
  --bad:#ff5d5d;       /* errado */
  --display:'Anton',Impact,'Arial Narrow',sans-serif;
  --body:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(ellipse at 50% -10%,#2a2233 0%,var(--bg) 60%) fixed,var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;min-height:100vh}
button{font:inherit;color:inherit}
.wrap{max-width:1000px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(32px,6vw,52px);line-height:1;margin:0;letter-spacing:.02em;text-transform:uppercase}
h1 span{color:var(--gold)}
.stats{display:flex;gap:18px;flex-wrap:wrap;font-family:var(--mono);font-size:13px;color:var(--muted)}
.stats b{color:var(--ink);font-size:18px;display:block;font-variant-numeric:tabular-nums}
.lives{color:var(--bad);letter-spacing:.1em;font-size:18px}
.helps{display:flex;flex-wrap:wrap;gap:8px}
.help{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);padding:8px 12px;border-radius:999px;cursor:pointer;font-size:14px}
.help .c{font-family:var(--mono);background:var(--gold);color:#1a1405;border-radius:999px;min-width:22px;text-align:center;font-weight:700;font-size:12px;padding:1px 6px}
.help:disabled{opacity:.4;cursor:not-allowed}
.help:not(:disabled):hover{border-color:var(--gold)}
.progress{font-size:13px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap}
.progress i{font-style:normal;color:var(--gold)}

.stage{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:28px;align-items:start}
.poster{position:relative;aspect-ratio:2/3;width:100%;max-width:100%;border-radius:6px;overflow:hidden;background:var(--panel);box-shadow:0 0 0 1px var(--line),0 30px 80px -20px rgba(242,193,78,.25)}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.veil{position:absolute;left:0;right:0;backdrop-filter:blur(18px) saturate(.8);-webkit-backdrop-filter:blur(18px) saturate(.8);background:rgba(12,11,16,.15);transition:opacity .5s}
.veil.top{top:0;height:24%}
.veil.bot{bottom:0;height:34%}
.poster.reveal .veil{opacity:0}
.badge{position:absolute;top:10px;left:10px;font-family:var(--mono);font-size:11px;background:rgba(0,0,0,.65);padding:3px 8px;border-radius:4px;color:var(--muted)}
.ask{display:grid;gap:14px;min-width:0}
.ask h2{font-family:var(--display);font-weight:400;font-size:clamp(24px,3.4vw,32px);margin:0;text-transform:uppercase;letter-spacing:.02em}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--line);padding:14px 16px;border-radius:6px;cursor:pointer;font-size:17px;font-weight:500;display:flex;gap:12px;align-items:baseline;transition:border-color .15s,transform .15s}
.opt .k{font-family:var(--mono);color:var(--muted);font-size:13px}
.opt:hover:not(:disabled){border-color:var(--gold);transform:translateX(3px)}
.opt:disabled{cursor:default}
.opt.gone{opacity:.18;text-decoration:line-through}
.opt.ok{border-color:var(--ok);background:rgba(62,207,142,.12)}
.opt.bad{border-color:var(--bad);background:rgba(255,93,93,.12)}
.opt.hint{border-color:var(--gold);box-shadow:0 0 24px rgba(242,193,78,.5)}
.feedback{min-height:56px;display:grid;gap:4px}
.feedback .t{font-family:var(--display);font-size:24px;text-transform:uppercase}
.feedback .t.ok{color:var(--ok)}.feedback .t.bad{color:var(--bad)}
.feedback .d{color:var(--muted);font-size:14px}
.primary{justify-self:start;background:var(--gold);color:#1a1405;border:0;padding:12px 22px;border-radius:6px;font-weight:700;cursor:pointer;font-size:16px}
.primary:disabled{opacity:.5}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* Desafio de ranking */
.rank{display:grid;gap:10px}
.ritem{display:grid;grid-template-columns:28px 54px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;cursor:grab}
.ritem.drag{opacity:.4}
.ritem .pos{font-family:var(--display);font-size:24px;color:var(--gold);text-align:center}
.ritem img{width:54px;height:81px;object-fit:cover;border-radius:3px;background:#222}
.ritem .nm{font-weight:700;min-width:0}
.ritem .val{font-family:var(--mono);font-size:13px;color:var(--muted)}
.ritem .mv{display:flex;flex-direction:column;gap:4px}
.ritem .mv button{background:transparent;border:1px solid var(--line);border-radius:4px;width:34px;height:30px;cursor:pointer}
.ritem.ok{border-color:var(--ok)}.ritem.bad{border-color:var(--bad)}
.crit{display:inline-block;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;background:var(--gold);color:#1a1405;padding:3px 8px;border-radius:3px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:24px;display:grid;gap:14px;max-width:640px}
.card p{margin:0;color:var(--muted)}
.card ul{margin:0;padding-left:1.2em;color:var(--muted);display:grid;gap:6px}
.card b{color:var(--ink)}
.field{display:grid;gap:6px}
.field input{background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:12px;border-radius:6px;font-family:var(--mono);font-size:14px;width:100%}
.err{color:var(--bad);font-size:14px;min-height:1.2em}
a{color:var(--gold)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(120%);background:var(--gold);color:#1a1405;padding:12px 20px;border-radius:8px;font-weight:700;transition:transform .35s;z-index:5;max-width:calc(100% - 32px);text-align:center}
.toast.on{transform:translateX(-50%) translateY(0)}
footer{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.loading{color:var(--muted);font-family:var(--mono);font-size:14px}
@media (max-width:700px){.stage{grid-template-columns:1fr}.poster{max-width:280px;margin:0 auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Capa <span>Desfocada</span></h1>
    <div class="stats" id="stats" hidden>
      <div>Pontos<b id="sPts">0</b></div>
      <div>Certas<b id="sOk">0</b></div>
      <div>Vidas<b class="lives" id="sLives">♥♥♥</b></div>
      <div>Recorde<b id="sBest">0</b></div>
    </div>
  </header>

  <div id="bar" hidden style="display:grid;gap:10px">
    <div class="helps">
      <button class="help" id="hFifty" type="button" title="Elimina 2 respostas erradas">50/50 <span class="c" id="cFifty">0</span></button>
      <button class="help" id="hEraser" type="button" title="Apaga 1 resposta errada">Borracha <span class="c" id="cEraser">0</span></button>
      <button class="help" id="hBull" type="button" title="Dá-te a resposta certa">Na mouche <span class="c" id="cBull">0</span></button>
    </div>
    <div class="progress"><span>Próxima ajuda: <i id="pHelp">5</i> certas</span><span>Desafio de ranking: <i id="pRank">10</i> certas</span></div>
  </div>

  <main id="main"></main>

  <footer>Dados e imagens de <a href="https://www.themoviedb.org/" target="_blank" rel="noopener">TMDB</a>. Este jogo usa a API do TMDB mas não é apoiado nem certificado pelo TMDB. Os óscares vêm de uma tabela incluída no jogo, porque o TMDB não os tem.</footer>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ---------- configuração ---------- */
const IMG='https://image.tmdb.org/t/p/';
const LIVES=3, HELP_EVERY=5, RANK_EVERY=10;
// Vitórias nos Óscares (tabela fixa: o TMDB não tem prémios)
const OSCARS=[
 ['Titanic',1997,11],['Ben-Hur',1959,11],['The Lord of the Rings: The Return of the King',2003,11],
 ['The English Patient',1996,9],['The Last Emperor',1987,9],
 ['Slumdog Millionaire',2008,8],['Amadeus',1984,8],['Gandhi',1982,8],
 ['Oppenheimer',2023,7],['Everything Everywhere All at Once',2022,7],["Schindler's List",1993,7],['Gravity',2013,7],['Lawrence of Arabia',1962,7],['Dances with Wolves',1990,7],['Shakespeare in Love',1998,7],['Out of Africa',1985,7],['The Sting',1973,7],
 ['Forrest Gump',1994,6],['La La Land',2016,6],['Mad Max: Fury Road',2015,6],['Dune',2021,6],['Star Wars',1977,6],['The Godfather Part II',1974,6],['Chicago',2002,6],['The Hurt Locker',2008,6],
 ['Gladiator',2000,5],['The Silence of the Lambs',1991,5],['Braveheart',1995,5],['American Beauty',1999,5],['Saving Private Ryan',1998,5],['The Artist',2011,5],["One Flew Over the Cuckoo's Nest",1975,5],['The Aviator',2004,5],['Hugo',2011,5],['Anora',2024,5],
 ['Parasite',2019,4],['Inception',2010,4],['The Matrix',1999,4],['The Departed',2006,4],['The Shape of Water',2017,4],['No Country for Old Men',2007,4],['A Beautiful Mind',2001,4],['Million Dollar Baby',2004,4],["The King's Speech",2010,4],['Birdman',2014,4],['Life of Pi',2012,4],['Bohemian Rhapsody',2018,4],['Poor Things',2023,4],['The Lord of the Rings: The Fellowship of the Ring',2001,4],
 ['The Godfather',1972,3],['Avatar',2009,3],['Jurassic Park',1993,3],['Black Panther',2018,3],['Whiplash',2014,3],['The Revenant',2015,3],['Green Book',2018,3],['Moonlight',2016,3],['Argo',2012,3],['12 Years a Slave',2013,3],['Rocky',1976,3],['Nomadland',2020,3],['CODA',2021,3],
 ['The Dark Knight',2008,2],['Joker',2019,2],['Coco',2017,2],['Up',2009,2],['Frozen',2013,2],['Spotlight',2015,2],['Good Will Hunting',1997,2],['Dune: Part Two',2024,2],['Toy Story 3',2010,2],['The Lord of the Rings: The Two Towers',2002,2],
 ['Pulp Fiction',1994,1],['Interstellar',2014,1],['Spirited Away',2001,1],['Top Gun: Maverick',2022,1],['Barbie',2023,1],['Inside Out',2015,1],['Spider-Man: Into the Spider-Verse',2018,1],['Back to the Future',1985,1],['Goodfellas',1990,1],
 ['The Shawshank Redemption',1994,0],['Fight Club',1999,0],['Avengers: Endgame',2019,0],['Se7en',1995,0],['The Green Mile',1999,0],['The Wolf of Wall Street',2013,0],['Taxi Driver',1976,0]
];
const money=v=>v>=1e9?(v/1e9).toFixed(2).replace('.',',')+' mil M$':Math.round(v/1e6)+' M$';
const CRITERIA=[
 {k:'year',label:'Ano de estreia',how:'do mais antigo para o mais recente',dir:1,get:m=>+(m.release_date||'0').slice(0,4)+(+(m.release_date||'').slice(5,7)||0)/100,fmt:m=>(m.release_date||'').split('-').reverse().join('/')},
 {k:'revenue',label:'Bilheteira mundial',how:'da maior para a menor',dir:-1,details:true,get:m=>m.revenue,fmt:m=>money(m.revenue)},
 {k:'runtime',label:'Duração',how:'do mais longo para o mais curto',dir:-1,details:true,get:m=>m.runtime,fmt:m=>m.runtime+' min'},
 {k:'vote',label:'Nota no TMDB',how:'da mais alta para a mais baixa',dir:-1,get:m=>m.vote_average,fmt:m=>m.vote_average.toFixed(2).replace('.',',')},
 {k:'budget',label:'Orçamento',how:'do maior para o menor',dir:-1,details:true,get:m=>m.budget,fmt:m=>money(m.budget)},
 {k:'oscars',label:'Óscares ganhos',how:'do que ganhou mais para o que ganhou menos',dir:-1,oscars:true,get:m=>m.oscars,fmt:m=>m.oscars+(m.oscars===1?' óscar':' óscares')}
];

/* ---------- utilitários ---------- */
const $=id=>document.getElementById(id);
const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let toastT;function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2600)}

let KEY=store.get('tmdbKey','');
async function api(path,params={}){
  const u=new URL('https://api.themoviedb.org/3'+path);
  const p={language:'pt-PT',...params};
  const headers={accept:'application/json'};
  if(KEY.startsWith('eyJ'))headers.Authorization='Bearer '+KEY;else p.api_key=KEY;
  for(const [k,v] of Object.entries(p))if(v!=null)u.searchParams.set(k,v);
  const r=await fetch(u,{headers});
  if(r.status===401)throw new Error('chave');
  if(!r.ok)throw new Error('rede '+r.status);
  return r.json();
}
const loadImg=src=>new Promise(res=>{const i=new Image();i.onload=()=>res(src);i.onerror=()=>res(src);i.src=src});

/* ---------- estado ---------- */
const S={pts:0,ok:0,lives:LIVES,best:+store.get('best',0),helps:{fifty:0,eraser:0,bull:0},pool:[],used:new Set(),pages:new Set(),q:null,next:null,answered:false,pendingRank:false};

async function fillPool(){
  // filmes conhecidos: os mais votados do TMDB, páginas ao acaso
  const tries=[];while(tries.length<3){const p=1+rnd(25);if(!S.pages.has(p)){S.pages.add(p);tries.push(p)}if(S.pages.size>=25)break}
  const res=await Promise.all(tries.map(p=>api('/discover/movie',{sort_by:'vote_count.desc',include_adult:false,page:p,'vote_count.gte':1500})));
  for(const r of res)for(const m of r.results)if(m.poster_path&&m.title&&!S.pool.some(x=>x.id===m.id))S.pool.push(m);
}
function similar(a,b){let s=a.genre_ids.filter(g=>b.genre_ids.includes(g)).length*2;const ya=+(a.release_date||'0').slice(0,4),yb=+(b.release_date||'0').slice(0,4);if(Math.abs(ya-yb)<=8)s+=2;return s+Math.random()*1.5}
async function buildQuestion(){
  if(S.pool.filter(m=>!S.used.has(m.id)).length<8&&S.pages.size<25)await fillPool();
  const free=S.pool.filter(m=>!S.used.has(m.id));
  if(!free.length){S.used.clear();return buildQuestion()}
  const m=free[rnd(free.length)];S.used.add(m.id);
  const titles=new Set([m.title.toLowerCase()]);
  const cands=S.pool.filter(x=>x.id!==m.id).sort((a,b)=>similar(m,b)-similar(m,a)).slice(0,14);
  const wrong=[];for(const c of shuffle(cands)){if(!titles.has(c.title.toLowerCase())){titles.add(c.title.toLowerCase());wrong.push(c)}if(wrong.length===3)break}
  // prefere um cartaz sem texto; se não houver, usa o normal e desfoca as zonas do título
  let path=m.poster_path,textless=false;
  try{const im=await api(`/movie/${m.id}/images`,{language:null,include_image_language:'null'});const ps=(im.posters||[]).sort((a,b)=>b.vote_average-a.vote_average);if(ps.length){path=ps[0].file_path;textless=true}}catch(e){}
  const src=IMG+'w500'+path;await loadImg(src);
  return {m,src,textless,opts:shuffle([m,...wrong]).map(x=>({id:x.id,title:x.title,gone:false}))};
}

/* ---------- ecrãs ---------- */
function setupScreen(err=''){
  $('stats').hidden=true;$('bar').hidden=true;
  $('main').innerHTML=`<div class="card">
    <h2 style="font-family:var(--display);font-weight:400;font-size:28px;margin:0;text-transform:uppercase">Como se joga</h2>
    <ul>
      <li>Aparece o cartaz de um filme com o título desfocado. Escolhe o nome certo entre 4 hipóteses.</li>
      <li>Tens <b>3 vidas</b>. Cada resposta errada tira uma.</li>
      <li>A cada <b>5 certas</b> ganhas uma ajuda: <b>50/50</b>, <b>Borracha</b> ou, mais rara, <b>Na mouche</b>.</li>
      <li>A cada <b>10 certas</b> vem um desafio: ordenar 5 filmes por ano, bilheteira, óscares, duração, nota ou orçamento.</li>
    </ul>
    <p>O jogo vai buscar os filmes ao TMDB e precisa da tua chave da API, que é gratuita. Cria uma conta e copia a chave em <a href="https://www.themoviedb.org/settings/api" target="_blank" rel="noopener">themoviedb.org/settings/api</a>. Serve a «Chave da API» ou o «Token de leitura». Fica guardada só neste navegador.</p>
    <form class="field" id="kf"><label for="key">Chave da API do TMDB</label><input id="key" autocomplete="off" spellcheck="false" placeholder="ex.: 3f1c… ou eyJhbGciOi…" value="${esc(KEY)}"><div class="err" id="kerr">${esc(err)}</div><button class="primary" type="submit">Começar</button></form>
  </div>`;
  $('kf').addEventListener('submit',e=>{e.preventDefault();KEY=$('key').value.trim();if(!KEY){$('kerr').textContent='Cola aqui a chave do TMDB.';return}store.set('tmdbKey',KEY);start()});
}
async function start(){
  Object.assign(S,{pts:0,ok:0,lives:LIVES,helps:{fifty:0,eraser:0,bull:0},pool:[],used:new Set(),pages:new Set(),next:null,pendingRank:false});
  $('main').innerHTML='<p class="loading">A carregar filmes…</p>';
  try{await fillPool();S.q=await buildQuestion()}catch(e){return setupScreen(e.message==='chave'?'O TMDB recusou a chave. Confirma que a copiaste toda.':'Não consegui ligar ao TMDB. Verifica a ligação à internet e tenta outra vez.')}
  $('stats').hidden=false;$('bar').hidden=false;showQuestion();
}
function updateBar(){
  $('sPts').textContent=S.pts;$('sOk').textContent=S.ok;$('sLives').textContent='♥'.repeat(S.lives)+'♡'.repeat(LIVES-S.lives);$('sBest').textContent=S.best;
  $('cFifty').textContent=S.helps.fifty;$('cEraser').textContent=S.helps.eraser;$('cBull').textContent=S.helps.bull;
  const q=S.q,live=q&&!S.answered&&!S.inRank;const left=q?q.opts.filter(o=>!o.gone).length:0;
  $('hFifty').disabled=!(live&&S.helps.fifty&&left>2);$('hEraser').disabled=!(live&&S.helps.eraser&&left>2);$('hBull').disabled=!(live&&S.helps.bull);
  $('pHelp').textContent=HELP_EVERY-(S.ok%HELP_EVERY);$('pRank').textContent=RANK_EVERY-(S.ok%RANK_EVERY);
}
function showQuestion(){
  S.answered=false;S.inRank=false;const q=S.q;
  $('main').innerHTML=`<div class="stage">
    <div class="poster" id="poster"><img src="${q.src}" alt="Cartaz do filme a adivinhar">${q.textless?'<span class="badge">cartaz sem texto</span>':'<div class="veil top"></div><div class="veil bot"></div>'}</div>
    <div class="ask"><h2>Que filme é este?</h2><div class="opts" id="opts"></div><div class="feedback" id="fb"></div><button class="primary" id="nextB" type="button" hidden>Seguinte</button></div>
  </div>`;
  renderOpts();updateBar();
  S.next=buildQuestion().catch(()=>null); // prepara a próxima pergunta em fundo
}
function renderOpts(){
  const q=S.q;$('opts').innerHTML='';
  q.opts.forEach((o,i)=>{const b=document.createElement('button');b.type='button';b.className='opt'+(o.gone?' gone':'')+(o.hint?' hint':'');b.innerHTML=`<span class="k">${'ABCD'[i]}</span><span>${esc(o.title)}</span>`;b.disabled=o.gone||S.answered;b.addEventListener('click',()=>answer(o.id));o.el=b;$('opts').appendChild(b)});
}
function answer(id){
  if(S.answered)return;S.answered=true;const q=S.q,good=id===q.m.id;
  q.opts.forEach(o=>{o.el.disabled=true;if(o.id===q.m.id)o.el.classList.add('ok');else if(o.id===id)o.el.classList.add('bad')});
  $('poster').classList.add('reveal');
  const y=(q.m.release_date||'').slice(0,4);
  if(good){S.ok++;S.pts+=10;$('fb').innerHTML=`<div class="t ok">Certo!</div><div class="d">${esc(q.m.title)}${y?' ('+y+')':''}${q.m.original_title&&q.m.original_title!==q.m.title?' · '+esc(q.m.original_title):''}</div>`;
    if(S.ok%HELP_EVERY===0)grantHelp();
    if(S.ok%RANK_EVERY===0)S.pendingRank=true}
  else{S.lives--;$('fb').innerHTML=`<div class="t bad">Errado</div><div class="d">Era <b>${esc(q.m.title)}</b>${y?' ('+y+')':''}.</div>`}
  if(S.pts>S.best){S.best=S.pts;store.set('best',S.best)}
  updateBar();
  const nb=$('nextB');nb.hidden=false;nb.textContent=S.lives<=0?'Ver resultado':S.pendingRank?'Desafio de ranking!':'Seguinte';nb.focus();
  nb.onclick=next;
}
function grantHelp(){const r=Math.random();const k=r<.45?'fifty':r<.9?'eraser':'bull';S.helps[k]++;toast('Ganhaste uma ajuda: '+{fifty:'50/50',eraser:'Borracha',bull:'Na mouche'}[k]+'!')}
async function next(){
  if(S.lives<=0)return gameOver();
  if(S.pendingRank){S.pendingRank=false;return rankChallenge()}
  $('nextB').disabled=true;$('nextB').textContent='A carregar…';
  S.q=(await S.next)||await buildQuestion().catch(()=>null);
  if(!S.q){$('fb').innerHTML='<div class="t bad">Sem ligação</div><div class="d">Não consegui ir buscar o próximo filme. Tenta outra vez.</div>';$('nextB').disabled=false;$('nextB').textContent='Tentar outra vez';S.next=buildQuestion().catch(()=>null);return}
  showQuestion();
}
function useHelp(k){
  const q=S.q;if(S.answered||!S.helps[k])return;
  const wrong=shuffle(q.opts.filter(o=>!o.gone&&o.id!==q.m.id));
  if(k==='fifty'){wrong.slice(0,wrong.length-1).slice(0,2).forEach(o=>o.gone=true)}
  if(k==='eraser'){wrong[0].gone=true}
  if(k==='bull'){q.opts.find(o=>o.id===q.m.id).hint=true}
  S.helps[k]--;renderOpts();updateBar();
  if(k==='bull')setTimeout(()=>answer(q.m.id),900);
}
$('hFifty').addEventListener('click',()=>useHelp('fifty'));$('hEraser').addEventListener('click',()=>useHelp('eraser'));$('hBull').addEventListener('click',()=>useHelp('bull'));

/* ---------- desafio de ranking ---------- */
async function pickRanking(){
  for(const c of shuffle(CRITERIA)){
    try{
      let films=[];
      if(c.oscars){
        const groups={};for(const o of OSCARS)(groups[o[2]]=groups[o[2]]||[]).push(o);
        const counts=shuffle(Object.keys(groups)).slice(0,5);
        for(const n of counts){const [t,y,os]=groups[n][rnd(groups[n].length)];
          let r=await api('/search/movie',{query:t,year:y});if(!r.results.length)r=await api('/search/movie',{query:t});
          const m=r.results[0];if(m&&m.poster_path)films.push({...m,oscars:os})}
      }else{
        let cand=shuffle(S.pool).slice(0,c.details?9:12);
        if(c.details)cand=await Promise.all(cand.map(m=>api('/movie/'+m.id)));
        const seen=new Set();for(const m of cand){const v=c.get(m);if(v&&!seen.has(v)){seen.add(v);films.push(m)}if(films.length===5)break}
      }
      if(films.length===5)return {c,films};
    }catch(e){}
  }
  return null;
}
async function rankChallenge(){
  S.inRank=true;updateBar();
  $('main').innerHTML='<p class="loading">A preparar o desafio de ranking…</p>';
  const R=await pickRanking();
  if(!R){toast('Não consegui preparar o desafio. Seguimos!');S.q=(await S.next)||await buildQuestion();return showQuestion()}
  let order=shuffle(R.films);
  const correct=R.films.slice().sort((a,b)=>(R.c.get(a)-R.c.get(b))*R.c.dir);
  $('main').innerHTML=`<div class="ask" style="max-width:680px">
    <span class="crit">${R.c.label}</span>
    <h2>Ordena ${R.c.how}</h2>
    <p style="margin:0;color:var(--muted)">Arrasta os filmes ou usa as setas. O primeiro da lista é o nº 1.</p>
    <div class="rank" id="rank"></div><div class="feedback" id="fb"></div>
    <button class="primary" id="go" type="button">Confirmar ordem</button></div>`;
  let done=false,dragI=null;
  function draw(){
    const box=$('rank');box.innerHTML='';
    order.forEach((m,i)=>{const d=document.createElement('div');d.className='ritem';d.draggable=!done;
      const ok=done&&correct[i].id===m.id;if(done)d.classList.add(ok?'ok':'bad');
      d.innerHTML=`<span class="pos">${i+1}</span><img src="${IMG}w154${m.poster_path}" alt=""><div class="nm">${esc(m.title)}<div class="val">${done?R.c.fmt(m):((m.release_date||'').slice(0,4)&&R.c.k!=='year'?(m.release_date||'').slice(0,4):'')}</div></div>
        <div class="mv">${done?'':`<button type="button" aria-label="Subir ${esc(m.title)}" data-u="${i}">▲</button><button type="button" aria-label="Descer ${esc(m.title)}" data-d="${i}">▼</button>`}</div>`;
      d.addEventListener('dragstart',()=>{dragI=i;d.classList.add('drag')});d.addEventListener('dragend',()=>d.classList.remove('drag'));
      d.addEventListener('dragover',e=>e.preventDefault());d.addEventListener('drop',e=>{e.preventDefault();if(dragI==null||dragI===i)return;const [x]=order.splice(dragI,1);order.splice(i,0,x);dragI=null;draw()});
      box.appendChild(d)});
    box.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{const i=+b.dataset.u;if(i>0){[order[i-1],order[i]]=[order[i],order[i-1]];draw()}});
    box.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const i=+b.dataset.d;if(i<4){[order[i+1],order[i]]=[order[i],order[i+1]];draw()}});
  }
  draw();
  $('go').onclick=async()=>{
    if(!done){done=true;const hits=order.filter((m,i)=>correct[i].id===m.id).length;
      let msg;
      if(hits===5){S.pts+=50;grantHelp();msg=`<div class="t ok">Perfeito! +50 pontos e uma ajuda extra</div>`}
      else if(hits>=3){S.pts+=hits*10;msg=`<div class="t ok">${hits} de 5 no sítio certo. +${hits*10} pontos</div>`}
      else{S.lives--;msg=`<div class="t bad">Só ${hits} de 5 no sítio certo. Perdes uma vida</div>`}
      order=correct;draw();$('fb').innerHTML=msg+'<div class="d">Esta é a ordem certa, com os valores.</div>';
      if(S.pts>S.best){S.best=S.pts;store.set('best',S.best)}updateBar();
      $('go').textContent=S.lives<=0?'Ver resultado':'Continuar';return}
    if(S.lives<=0)return gameOver();
    $('go').disabled=true;$('go').textContent='A carregar…';
    S.q=(await S.next)||await buildQuestion();showQuestion();
  };
}
function gameOver(){
  S.inRank=true;updateBar();
  $('main').innerHTML=`<div class="card"><h2 style="font-family:var(--display);font-weight:400;font-size:36px;margin:0;text-transform:uppercase">Fim da sessão</h2>
    <p>Acertaste <b>${S.ok}</b> filmes e fizeste <b>${S.pts}</b> pontos. O teu recorde é <b>${S.best}</b>.</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="primary" id="again" type="button">Jogar outra vez</button><button class="help" id="chg" type="button">Mudar chave do TMDB</button></div></div>`;
  $('again').onclick=start;$('chg').onclick=()=>setupScreen();
}

KEY?start():setupScreen();
</script>
