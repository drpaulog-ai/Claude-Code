name: Letrista APK

on:
  push:
    branches: ["**"]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle/**"
      - ".github/workflows/letrista-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Compilar APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk letrista.apk

      - uses: actions/upload-artifact@v4
        with:
          name: letrista-apk
          path: letrista.apk

      - name: Publicar como release (link direto para o telemóvel)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="letrista-${{ github.run_number }}"
          gh release create "$TAG" letrista.apk \
            --target "${{ github.sha }}" \
            --title "Letrista (build ${{ github.run_number }})" \
            --notes "APK para instalar diretamente no Android. Abra este link no telemóvel e toque em letrista.apk."
