name: SenhasPorto – build Windows portable

on:
  push:
    paths:
      - 'SenhasPorto/**'
      - '.github/workflows/senhasporto.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publicar .exe portable (win-x64, ficheiro único)
        run: dotnet publish SenhasPorto/SenhasPorto.csproj -c Release -o publish

      - name: Juntar instruções
        shell: pwsh
        run: Copy-Item SenhasPorto/LEIA-ME.md publish/

      - uses: actions/upload-artifact@v4
        with:
          name: SenhasPorto-win-x64-portable
          path: publish/
          if-no-files-found: error
