name: Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Testes da lógica do puzzle
        run: ./gradlew testDebugUnitTest
      - name: Compilar APK
        run: ./gradlew assembleRelease
      - name: Compatibilidade do APK (ecrãs, hardware, arquiteturas)
        run: |
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          "$AAPT2" dump badging app/build/outputs/apk/release/*.apk \
            | grep -E "^(package|sdkVersion|targetSdkVersion|uses-permission|uses-feature|uses-implied-feature|supports-screens|supports-any-density|densities|native-code|requires-smallest-width|compatible-width-limit|largest-width-limit)" \
            || true
          echo "--- native libs no APK:"
          unzip -l app/build/outputs/apk/release/*.apk | grep "lib/" || echo "(nenhuma — funciona em qualquer processador)"
      - uses: actions/upload-artifact@v4
        with:
          name: puzzle-de-fotos-apk
          path: app/build/outputs/apk/release/*.apk
