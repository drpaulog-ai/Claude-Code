name: App Android

on:
  push:
    branches: [claude/animation-film-from-description-8fedix]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verificar fontes de dados
        run: node android/tools/check-sources.mjs
        continue-on-error: true

      - name: Compilar APK
        run: gradle -p android assembleDebug --no-daemon

      - run: cp android/app/build/outputs/apk/debug/app-debug.apk capa-desfocada.apk

      - uses: actions/upload-artifact@v4
        with:
          name: capa-desfocada-apk
          path: capa-desfocada.apk

      - name: Publicar versão
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.run_number }}
          name: Capa Desfocada 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: capa-desfocada.apk
          body: |
            App Android do jogo Capa Desfocada.
            Descarregue `capa-desfocada.apk` no telemóvel e abra-o para instalar.
